kind = "web"
previewPath = "/"
title = "University Maintenance Request System"
version = "1.0.0"
id = "artifacts/maintenance-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23006

[services.development]
run = "pnpm --filter @workspace/maintenance-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/maintenance-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/maintenance-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23006"
BASE_PATH = "/"
