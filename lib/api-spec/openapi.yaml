openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: University Maintenance Request System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User management
  - name: categories
    description: Request categories
  - name: requests
    description: Service requests
  - name: dashboard
    description: Dashboard and reporting

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [student, staff, maintenance_officer, admin]
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"

  /users/officers:
    get:
      operationId: listOfficers
      tags: [users]
      summary: List maintenance officers
      responses:
        "200":
          description: List of maintenance officers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all request categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

    post:
      operationId: createCategory
      tags: [categories]
      summary: Create category (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update category (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete category (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /requests:
    get:
      operationId: listRequests
      tags: [requests]
      summary: List service requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, assigned, in_progress, completed, rejected]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, urgent]
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: submittedBy
          in: query
          schema:
            type: integer
        - name: assignedTo
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestList"

    post:
      operationId: createRequest
      tags: [requests]
      summary: Submit a new service request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestInput"
      responses:
        "201":
          description: Created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"

  /requests/{id}:
    get:
      operationId: getRequest
      tags: [requests]
      summary: Get service request by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service request with assignment and logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequestDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateRequest
      tags: [requests]
      summary: Update a service request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUpdate"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"

    delete:
      operationId: deleteRequest
      tags: [requests]
      summary: Delete a service request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /requests/{id}/assign:
    post:
      operationId: assignRequest
      tags: [requests]
      summary: Assign a request to a maintenance officer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentInput"
      responses:
        "200":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  /requests/{id}/status:
    post:
      operationId: updateRequestStatus
      tags: [requests]
      summary: Update the status of a request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdateInput"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusLog"

  /requests/{id}/logs:
    get:
      operationId: getRequestLogs
      tags: [requests]
      summary: Get status history for a request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Status logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusLog"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/recent:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /reports/export:
    get:
      operationId: exportReport
      tags: [dashboard]
      summary: Export requests as CSV
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    RegisterInput:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [student, staff, maintenance_officer, admin]
        department:
          type: string
        phone:
          type: string
        staffId:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, name, email, role, isActive, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [student, staff, maintenance_officer, admin]
        department:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        staffId:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        department:
          type: string
        phone:
          type: string
        isActive:
          type: boolean
        role:
          type: string
          enum: [student, staff, maintenance_officer, admin]

    UserList:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Category:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
        description:
          type: string

    ServiceRequest:
      type: object
      required: [id, title, description, status, priority, submittedBy, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        categoryId:
          type: ["integer", "null"]
        categoryName:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, assigned, in_progress, completed, rejected]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        location:
          type: ["string", "null"]
        evidenceUrl:
          type: ["string", "null"]
        submittedBy:
          type: integer
        submitterName:
          type: ["string", "null"]
        assignedTo:
          type: ["integer", "null"]
        officerName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ServiceRequestDetail:
      type: object
      required: [id, title, description, status, priority, submittedBy, createdAt, updatedAt, logs]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        categoryId:
          type: ["integer", "null"]
        categoryName:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, assigned, in_progress, completed, rejected]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        location:
          type: ["string", "null"]
        evidenceUrl:
          type: ["string", "null"]
        submittedBy:
          type: integer
        submitterName:
          type: ["string", "null"]
        submitterEmail:
          type: ["string", "null"]
        assignedTo:
          type: ["integer", "null"]
        officerName:
          type: ["string", "null"]
        assignment:
          oneOf:
            - $ref: "#/components/schemas/Assignment"
            - type: "null"
        logs:
          type: array
          items:
            $ref: "#/components/schemas/StatusLog"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RequestInput:
      type: object
      required: [title, description, priority]
      properties:
        title:
          type: string
          minLength: 5
        description:
          type: string
          minLength: 10
        categoryId:
          type: integer
        priority:
          type: string
          enum: [low, medium, high, urgent]
        location:
          type: string
        evidenceUrl:
          type: string

    RequestUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        categoryId:
          type: integer
        priority:
          type: string
          enum: [low, medium, high, urgent]
        location:
          type: string
        evidenceUrl:
          type: string

    RequestList:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRequest"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Assignment:
      type: object
      required: [id, requestId, officerId, assignedBy, assignedAt]
      properties:
        id:
          type: integer
        requestId:
          type: integer
        officerId:
          type: integer
        officerName:
          type: ["string", "null"]
        assignedBy:
          type: integer
        assignedByName:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        assignedAt:
          type: string
          format: date-time

    AssignmentInput:
      type: object
      required: [officerId]
      properties:
        officerId:
          type: integer
        notes:
          type: string

    StatusLog:
      type: object
      required: [id, requestId, newStatus, changedBy, createdAt]
      properties:
        id:
          type: integer
        requestId:
          type: integer
        changedBy:
          type: integer
        changedByName:
          type: ["string", "null"]
        oldStatus:
          type: ["string", "null"]
        newStatus:
          type: string
          enum: [pending, assigned, in_progress, completed, rejected]
        note:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    StatusUpdateInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, assigned, in_progress, completed, rejected]
        note:
          type: string

    DashboardSummary:
      type: object
      required: [total, pending, assigned, inProgress, completed, rejected, byCategory, byPriority]
      properties:
        total:
          type: integer
        pending:
          type: integer
        assigned:
          type: integer
        inProgress:
          type: integer
        completed:
          type: integer
        rejected:
          type: integer
        myRequests:
          type: ["integer", "null"]
        byCategory:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name:
                type: string
              count:
                type: integer
        byPriority:
          type: array
          items:
            type: object
            required: [priority, count]
            properties:
              priority:
                type: string
              count:
                type: integer

    ActivityItem:
      type: object
      required: [id, type, requestId, requestTitle, actorName, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [status_change, assignment, new_request]
        requestId:
          type: integer
        requestTitle:
          type: string
        actorName:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
